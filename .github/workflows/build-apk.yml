name: Build RAUL.OS APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'RAUL_OS_V2/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RAUL.OS V2 debug APK
        run: gradle -p RAUL_OS_V2 :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAUL-OS-V2-debug-apk
          path: RAUL_OS_V2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
