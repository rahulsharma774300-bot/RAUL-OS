name: Build RAUL.OS APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'project/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct Android project
        shell: bash
        run: |
          cat project/part01.b64 project/part02.b64 project/part03.b64 project/part04.b64 > project.zip.b64
          base64 --decode project.zip.b64 > project.zip
          unzip -q project.zip
          test -f RAUL_OS/settings.gradle
          test -f RAUL_OS/app/build.gradle

      - name: Build debug APK
        run: gradle -p RAUL_OS :app:assembleDebug --stacktrace

      - name: Save APK in repository
        shell: bash
        run: |
          mkdir -p apk
          cp RAUL_OS/app/build/outputs/apk/debug/app-debug.apk apk/RAUL-OS-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/RAUL-OS-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build RAUL.OS debug APK"
            git push
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAUL-OS-debug-apk
          path: RAUL_OS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
