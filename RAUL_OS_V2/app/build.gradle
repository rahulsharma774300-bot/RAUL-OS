plugins {
    id 'com.android.application'
}

android {
    namespace 'com.raul.os'
    compileSdk 35

    defaultConfig {
        applicationId "com.raul.os"
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
